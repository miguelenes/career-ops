name: Web CI

# CI for the experimental web UI (web/). Informative by design: it is NOT a
# required check for the core — a red here never blocks a core merge, and core
# changes never trigger it. The web/ tree versions and releases as its own
# release-please component.
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

# One run per ref: a new push cancels the run in progress. Tag runs are never cancelled.
concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test code (fork code, in a merge_group) must not find a token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # The doctor parity test runs the real core doctor.mjs, which imports the
      # core's own dependencies (js-yaml, dotenv). Installed the same way as
      # test.yml: use the root lockfile and skip the browser download.
      - name: Install core dependencies
        run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      # Restore incremental build caches for tsc and next
      - name: Restore tsc incremental build info
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: web/tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'web/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'web/tsconfig*.json') }}-
            tsc-${{ runner.os }}-
      - name: Restore Next.js build cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-
            next-${{ runner.os }}-
      # The web tree has its own lockfile, so this audits the
      # exact pinned versions (#5771's class of finding). This workflow is
      # informative by design: a red here blocks nothing, it is one more
      # place an advisory gets seen before it ships.
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      # The tests/lib/*.browser.test.mjs suites skip in `npm test` above: each
      # needs a running server's URL in an env var (#5764). This starts the
      # build above once per suite on disposable data and runs it there, where a
      # skip is a failure. They launch Google Chrome (`channel: "chrome"`), which
      # the ubuntu-latest image ships; checked first, so a runner image without
      # it fails here by name rather than in twelve launch errors.
      - name: Browser suites against the built app
        run: |
          google-chrome --version
          npm run test:browser
